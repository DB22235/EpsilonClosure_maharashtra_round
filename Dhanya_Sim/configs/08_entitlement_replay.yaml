scenario_id: 8
name: entitlement_replay
description: >
  50 attackers replay winner entitlement tokens after they have already been
  redeemed. Single-use entitlements must enforce atomic, one-time consumption.

campaign:
  capacity: 500
  registration_window_seconds: 120

engine:
  base_url: "http://localhost:8000"
  concurrency: 50
  timeout: 8.0
  http2: true
  ramp_seconds: 1.0

populations:
  - profile: token_replay_attacker
    count: 50
    is_bot: true
    params:
      replay_target: entitlement_token
      delay_before_replay_seconds: 3

assertions:
  replay_attack_successes: 0
  duplicate_allocation_violations: 0
  expected_rejection_codes: ["ENTITLEMENT_ALREADY_USED", "ENTITLEMENT_EXPIRED"]

output:
  dir: output/08_entitlement_replay
  json: true
  csv: true
