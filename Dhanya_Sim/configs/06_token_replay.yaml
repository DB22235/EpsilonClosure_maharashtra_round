scenario_id: 6
name: token_replay
description: >
  50 attackers capture valid admission permits and challenge nonces then
  replay them after they have already been consumed. All replays must be rejected.

campaign:
  capacity: 500
  registration_window_seconds: 120

engine:
  base_url: "http://localhost:8000"
  concurrency: 50
  timeout: 8.0
  http2: true
  ramp_seconds: 1.0

populations:
  - profile: token_replay_attacker
    count: 50
    is_bot: true
    params:
      replay_target: admission_permit
      delay_before_replay_seconds: 5

assertions:
  replay_attack_successes: 0
  oversell_violations: 0
  expected_rejection_codes: ["PERMIT_ALREADY_USED", "PERMIT_EXPIRED", "REPLAY_DETECTED"]

output:
  dir: output/06_token_replay
  json: true
  csv: true
