scenario_id: 9
name: race_condition_seat
description: >
  50 parallel clients race to atomically hold the exact same 10 seat IDs
  simultaneously. Validates that PostgreSQL atomic holds prevent oversell
  and that at most 1 client succeeds per seat.

campaign:
  capacity: 10
  registration_window_seconds: 60

engine:
  base_url: "http://localhost:8000"
  concurrency: 50
  timeout: 10.0
  http2: true
  ramp_seconds: 0.0   # zero ramp — simultaneous fire

populations:
  - profile: race_condition_attacker
    count: 50
    is_bot: true
    params:
      target_seat_ids: ["seat_001","seat_002","seat_003","seat_004","seat_005",
                        "seat_006","seat_007","seat_008","seat_009","seat_010"]

assertions:
  oversell_violations: 0
  duplicate_allocation_violations: 0
  confirmed_seats_max: 10

output:
  dir: output/09_race_condition_seat
  json: true
  csv: true
